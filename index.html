<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OndePassa Fut — Guia de Jogos e Onde Assistir</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --muted: #94a3b8;
            --border: #334155;
            --primary: #22c55e;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
        }
        .card {
            max-width: 520px;
            width: 100%;
            background-color: var(--card);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 32px 24px;
            text-align: center;
        }
        .logo {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 10px;
        }
        .logo span {
            color: var(--primary);
        }
        p {
            color: var(--muted);
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 24px;
        }
        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn {
            display: block;
            padding: 13px 18px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            text-decoration: none;
            background-color: var(--bg);
            color: var(--text);
            border: 1px solid var(--border);
            transition: border-color 0.2s;
        }
        .btn:hover {
            border-color: var(--primary);
        }
        .contact {
            margin-top: 24px;
            font-size: 13px;
            color: var(--muted);
        }
        .contact a {
            color: var(--primary);
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">⚽ OndePassa <span>Fut</span></div>
        <p>Descubra onde assistir aos jogos da Seleção Brasileira e das principais competições nacionais e continentais, com horários, placares e tabelas atualizadas.</p>
        <div class="links">
            <a class="btn" href="privacidade.html">Política de Privacidade</a>
            <a class="btn" href="termos.html">Termos de Uso</a>
        </div>
        <div class="contact">
            Suporte: <a href="mailto:contato.danielonchip@gmail.com">contato.danielonchip@gmail.com</a>
        </div>
    </div>
</body>
</html>
